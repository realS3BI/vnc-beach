name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: vnc-beach-${{ matrix.os }}
          path: |
            target/release/beach-server
            target/release/beach-viewer
            target/release/beach-server.exe
            target/release/beach-viewer.exe
          if-no-files-found: ignore
