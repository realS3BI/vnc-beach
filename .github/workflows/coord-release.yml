# Publishes the coordination server for every published GitHub release, in
# two forms that work with any host:
#
# - the branch `release` points at the release's tag. Hosts that deploy from
#   git (Coolify, Dokploy, CapRover, …) follow that branch instead of `main`.
# - the image ghcr.io/OWNER/beach-coord:X.Y.Z (and :latest) for hosts that
#   run images (docker run, Compose, Kubernetes, watchtower, …).
#
# Neither needs a secret. Pre-releases are skipped.
name: Coordination server

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.4.2)
        required: true

permissions: {}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  branch:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Move the branch release to the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          # A push made with GITHUB_TOKEN doesn't start workflows, but
          # GitHub Apps (a host's deploy webhook) still get the push event.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" -f sha="$sha" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/release -f sha="$sha"
          echo "release -> $TAG ($sha)"

  image:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/beach-coord
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/beach-coord/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
