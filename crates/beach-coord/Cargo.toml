[package]
name = "beach-coord"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VNC Beach coordination server: accounts, organizations and their devices"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
beach-account = { version = "0.3.0", path = "../beach-account" }
rfb = { version = "0.3.0", path = "../rfb" }
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
log = "0.4.34"
rand = "0.10.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal"] }
ureq = { version = "3.5", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
