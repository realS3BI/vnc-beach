[package]
name = "beach-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "6"
enigo = "0.6.1"
env_logger = "0.11.11"
gethostname = "1.1.0"
log = "0.4.34"
rfb = { version = "0.2.3", path = "../rfb" }
tempfile = "3.27"
xcap = "0.9.8"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_StationsAndDesktops"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
