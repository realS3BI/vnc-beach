[package]
name = "beach-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
beach-server = { version = "0.2.0", path = "../beach-server" }
clap = { version = "4.6.7", features = ["derive", "env"] }
eframe = "0.36.2"
egui = "0.36"
env_logger = "0.11.11"
log = "0.4.34"
rfb = { version = "0.2.0", path = "../rfb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30.13", default-features = false }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
winreg = "0.56"

[build-dependencies]
embed-resource = "3"
