[package]
name = "beach-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
beach-server = { version = "0.3.2", path = "../beach-server" }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "6"
eframe = "0.36.2"
egui = "0.36"
env_logger = "0.11.11"
log = "0.4.34"
rfb = { version = "0.3.2", path = "../rfb" }
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
beach-access = { version = "0.3.2", path = "../beach-access" }
beach-account = { version = "0.3.2", path = "../beach-account" }
if-addrs = "0.15"
gethostname = "1.1.0"
rand = "0.10.3"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
toml = "1.1"
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30.13", default-features = false }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
muda = { version = "0.21", default-features = false }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
winreg = "0.56"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3.27"
image = { version = "0.25", default-features = false, features = ["png"] }
